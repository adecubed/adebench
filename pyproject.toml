[project]
name = "adebench"
version = "0.2.7"
description = "A benchmark for personal AI memory, on its own terms: what the client actually receives, entity cards, fact updates, age, live state, abstention, file search, graph. ADE Brain first, any memory via adapter."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Adecubed"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/adecubed/adebench"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adebench"]
