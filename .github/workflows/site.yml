name: site

# adebench.dev: the leaderboard is generated from the reference reports in
# examples/ and published with GitHub Pages (Settings → Pages → Source:
# GitHub Actions; custom domain adebench.dev).
on:
  push:
    branches: [main]
    paths:
      - "examples/*_report/reference.json"
      - "examples/own_data/**"
      - "site_assets/**"
      - "adebench/site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m adebench.site
        env:
          GOATCOUNTER: adebench   # visits at https://adebench.goatcounter.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
